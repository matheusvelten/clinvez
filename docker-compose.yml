services:
  postgres:
    image: postgres:16-alpine
    container_name: agendei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agenda
    ports:
      - "5432:5432"
    volumes:
      - agendei-data:/var/lib/postgresql/data

volumes:
  agendei-data:
