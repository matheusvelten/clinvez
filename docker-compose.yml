services:
  postgres:
    image: postgres:16-alpine
    container_name: clinvez-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agenda
    ports:
      - "5432:5432"
    volumes:
      - clinvez-data:/var/lib/postgresql/data

volumes:
  clinvez-data:
